<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="t d"><title id="t">NN engine compute-tile hierarchy</title><desc id="d">Q3.5 activations and frozen Q3.5 weights independently enter the 8 by 8 processing-element array. Products are reduced, accumulated in 32 bits, and passed through a shift-based leaky ReLU.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#68777B"/></marker><style>.b{fill:#fff;stroke:#AAB6B4;stroke-width:2}.g{fill:#E8F1E9;stroke:#698873;stroke-width:2}.w{fill:#F7EDDD;stroke:#A77F51;stroke-width:2}.h{font:700 22px Arial;fill:#30393C}.s{font:600 15px Arial;fill:#526065}.x{stroke:#68777B;stroke-width:3;fill:none;marker-end:url(#a)}.n{font:500 14px Arial;fill:#6B7576}</style></defs><rect width="1200" height="590" fill="#FBFAF7"/><text x="55" y="58" class="h">nn_engine_tile_top compute-tile hierarchy</text><text x="55" y="84" class="n">Implemented RTL module hierarchy</text>
<g transform="translate(35 155)"><rect class="b" width="175" height="120" rx="13"/><text class="h" x="87" y="44" text-anchor="middle">Activation tile</text><text class="s" x="87" y="78" text-anchor="middle">Q3.5 inputs</text></g>
<g transform="translate(35 325)"><rect class="w" width="175" height="120" rx="13"/><text class="h" x="87" y="44" text-anchor="middle">Weight ROM</text><text class="s" x="87" y="78" text-anchor="middle">frozen Q3.5 weights</text></g>
<g transform="translate(330 205)"><rect class="g" width="210" height="190" rx="13"/><text class="h" x="105" y="45" text-anchor="middle">8×8 PE array</text><text class="s" x="105" y="84" text-anchor="middle">64 signed Braun</text><text class="s" x="105" y="110" text-anchor="middle">multipliers</text><text class="s" x="105" y="141" text-anchor="middle">weight-stationary MAC</text></g>
<path class="x" d="M210 215H270V265H330"/><path class="x" d="M210 385H270V335H330"/>
<path class="x" d="M540 300H610"/><g transform="translate(610 215)"><rect class="w" width="165" height="170" rx="13"/><text class="h" x="82" y="45" text-anchor="middle">Row reduction</text><text class="s" x="82" y="85" text-anchor="middle">balanced adder tree</text><text class="s" x="82" y="116" text-anchor="middle">partial sums</text></g>
<path class="x" d="M775 300H830"/><g transform="translate(830 215)"><rect class="b" width="150" height="170" rx="13"/><text class="h" x="75" y="45" text-anchor="middle">Accumulator</text><text class="s" x="75" y="85" text-anchor="middle">32-bit bank</text></g>
<path class="x" d="M980 300H1030"/><g transform="translate(1030 215)"><rect class="g" width="140" height="170" rx="13"/><text class="h" x="70" y="45" text-anchor="middle">Leaky ReLU</text><text class="s" x="70" y="85" text-anchor="middle">output tile</text></g>
<g transform="translate(670 465)"><rect class="b" width="500" height="70" rx="12" stroke-dasharray="8 6"/><text class="s" x="250" y="28" text-anchor="middle">Array controller and argmax10 belong to the wider system</text><text class="s" x="250" y="52" text-anchor="middle">and are not instantiated in nn_engine_tile_top</text></g></svg>
