<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Mixed-signal ELM architecture</title><desc id="d">Digital inputs are converted to analog currents, processed by a current-mirror hidden layer and oscillator neurons, counted, scanned, and sent to the trained output stage.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#72543d"/></marker><style>.b{fill:#fff;stroke:#403d36;stroke-width:2}.g{fill:#eef1eb;stroke:#49604e;stroke-width:2}.w{fill:#f5eee7;stroke:#72543d;stroke-width:2}.h{font:700 23px Arial;fill:#25231f}.s{font:600 15px Arial;fill:#403d36}.x{stroke:#72543d;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect width="1200" height="620" fill="#f7f6f2"/><text x="55" y="62" class="h">Mixed-Signal Extreme Learning Machine</text><g transform="translate(35 210)"><rect class="b" width="150" height="145" rx="13"/><text class="h" x="75" y="43" text-anchor="middle">Input A&lt;6:0&gt;</text><text class="s" x="75" y="80" text-anchor="middle">digital training</text><text class="s" x="75" y="106" text-anchor="middle">samples</text></g><path class="x" d="M185 282H225"/><g transform="translate(225 190)"><rect class="w" width="165" height="185" rx="13"/><text class="h" x="82" y="43" text-anchor="middle">1-to-128</text><text class="h" x="82" y="72" text-anchor="middle">demultiplexer</text><text class="s" x="82" y="112" text-anchor="middle">input selection</text></g><path class="x" d="M390 282H430"/><g transform="translate(430 170)"><rect class="b" width="180" height="225" rx="13"/><text class="h" x="90" y="43" text-anchor="middle">DAC + IGC</text><text class="s" x="90" y="80" text-anchor="middle">reference current</text><text class="s" x="90" y="107" text-anchor="middle">input generation</text><text class="s" x="90" y="134" text-anchor="middle">IGC1 … IGCd</text></g><path class="x" d="M610 282H650"/><g transform="translate(650 170)"><rect class="g" width="185" height="225" rx="13"/><text class="h" x="92" y="43" text-anchor="middle">Current-mirror</text><text class="h" x="92" y="72" text-anchor="middle">array</text><text class="s" x="92" y="112" text-anchor="middle">mismatch weights</text><text class="s" x="92" y="139" text-anchor="middle">hidden layer</text></g><path class="x" d="M835 282H875"/><g transform="translate(875 170)"><rect class="w" width="145" height="225" rx="13"/><text class="h" x="72" y="43" text-anchor="middle">Oscillator</text><text class="h" x="72" y="72" text-anchor="middle">neurons</text><text class="s" x="72" y="112" text-anchor="middle">N1 … NL</text><text class="s" x="72" y="139" text-anchor="middle">frequency code</text></g><path class="x" d="M1020 282H1055"/><g transform="translate(1055 170)"><rect class="b" width="110" height="225" rx="13"/><text class="h" x="55" y="43" text-anchor="middle">Counters</text><text class="s" x="55" y="82" text-anchor="middle">CNT1 …</text><text class="s" x="55" y="108" text-anchor="middle">CNTL</text><text class="s" x="55" y="145" text-anchor="middle">PIPO</text></g><path class="x" d="M1110 395V455H900"/><g transform="translate(700 455)"><rect class="g" width="400" height="110" rx="13"/><text class="h" x="200" y="42" text-anchor="middle">Column scanner → trained ELM output stage</text><text class="s" x="200" y="76" text-anchor="middle">C&lt;13:0&gt; · second-stage readout</text></g><g transform="translate(240 70)"><rect class="b" width="700" height="70" rx="12"/><text class="h" x="350" y="30" text-anchor="middle">Timing &amp; control</text><text class="s" x="350" y="54" text-anchor="middle">CLK_in · RN_cnt · NEU_EN · CLK_out · rotation enable</text></g><path class="x" d="M590 140V165"/></svg>
