<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="t d"><title id="t">Redrawn mixed-signal ELM architecture</title><desc id="d">Digital samples are converted to currents, weighted by current mirrors, and transformed to oscillator frequencies. TSPC counters and a PIPO scanner digitize the hidden-layer response. Timing and rotation control drive the selection and counting blocks. The final readout was evaluated in MATLAB.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#72543d"/></marker><style>.b{fill:#fff;stroke:#403d36;stroke-width:2}.g{fill:#eef1eb;stroke:#49604e;stroke-width:2}.w{fill:#f5eee7;stroke:#72543d;stroke-width:2}.h{font:700 22px Arial;fill:#25231f}.s{font:600 15px Arial;fill:#403d36}.n{font:500 14px Arial;fill:#6b675f}.x{stroke:#72543d;stroke-width:3;fill:none;marker-end:url(#a)}.ctl{stroke:#49604e;stroke-width:2;stroke-dasharray:7 5;fill:none;marker-end:url(#a)}</style></defs><rect width="1200" height="660" fill="#f7f6f2"/><text x="55" y="58" class="h">Mixed-signal Extreme Learning Machine</text><text x="55" y="84" class="n">Redrawn from the report architecture; the trained readout remained in MATLAB</text>
<g transform="translate(30 245)"><rect class="b" width="135" height="125" rx="13"/><text class="h" x="67" y="42" text-anchor="middle">Input samples</text><text class="s" x="67" y="78" text-anchor="middle">digital A&lt;6:0&gt;</text></g><path class="x" d="M165 307H205"/>
<g transform="translate(205 220)"><rect class="w" width="155" height="175" rx="13"/><text class="h" x="77" y="43" text-anchor="middle">Input select</text><text class="s" x="77" y="82" text-anchor="middle">1-to-128 DEMUX</text></g><path class="x" d="M360 307H400"/>
<g transform="translate(400 205)"><rect class="b" width="170" height="205" rx="13"/><text class="h" x="85" y="43" text-anchor="middle">DAC + IGC</text><text class="s" x="85" y="82" text-anchor="middle">digital-to-current</text><text class="s" x="85" y="109" text-anchor="middle">input generation</text></g><path class="x" d="M570 307H610"/>
<g transform="translate(610 205)"><rect class="g" width="175" height="205" rx="13"/><text class="h" x="87" y="43" text-anchor="middle">Current mirrors</text><text class="s" x="87" y="82" text-anchor="middle">mismatch-derived</text><text class="s" x="87" y="109" text-anchor="middle">hidden weights</text></g><path class="x" d="M785 307H825"/>
<g transform="translate(825 205)"><rect class="w" width="155" height="205" rx="13"/><text class="h" x="77" y="43" text-anchor="middle">Oscillator</text><text class="h" x="77" y="70" text-anchor="middle">neurons</text><text class="s" x="77" y="111" text-anchor="middle">current → frequency</text></g><path class="x" d="M980 307H1005"/>
<g transform="translate(1005 205)"><rect class="b" width="165" height="205" rx="13"/><text class="h" x="82" y="43" text-anchor="middle">TSPC counters</text><text class="s" x="82" y="82" text-anchor="middle">carry + PIPO</text><text class="s" x="82" y="109" text-anchor="middle">column scan</text></g>
<g transform="translate(280 95)"><rect class="g" width="650" height="70" rx="12"/><text class="h" x="325" y="29" text-anchor="middle">Timing and rotation control</text><text class="s" x="325" y="54" text-anchor="middle">input select · neuron enable · counter reset · PIPO clock · column scan</text></g>
<path class="ctl" d="M370 165V215"/><path class="ctl" d="M760 165V200H900V205"/><path class="ctl" d="M890 165V185H1087V205"/>
<path class="x" d="M1087 410V480H880"/>
<g transform="translate(590 480)"><rect class="g" width="430" height="115" rx="13"/><text class="h" x="215" y="42" text-anchor="middle">Hidden-layer count matrix</text><text class="s" x="215" y="76" text-anchor="middle">exported to the trained MATLAB readout</text></g></svg>
