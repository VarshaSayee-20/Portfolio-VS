<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Mixed-signal ELM system architecture</title><desc id="d">Digital input conversion, current-mirror hidden layer, oscillator neurons, counters, column scanner, and output stage.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#72543d"/></marker><style>.b{fill:#fff;stroke:#403d36;stroke-width:2}.g{fill:#eef1eb;stroke:#49604e;stroke-width:2}.w{fill:#f5eee7;stroke:#72543d;stroke-width:2}.h{font:700 26px Arial;fill:#25231f}.s{font:600 18px Arial;fill:#403d36}.x{stroke:#72543d;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect width="1200" height="675" fill="#f7f6f2"/><text x="60" y="68" class="h">Implemented Mixed-Signal ELM Architecture</text><g transform="translate(60 145)"><rect class="b" width="180" height="110" rx="14"/><text class="h" x="90" y="48" text-anchor="middle">Digital input</text><text class="s" x="90" y="78" text-anchor="middle">A&lt;6:0&gt;</text></g><path class="x" d="M240 200H310"/><g transform="translate(310 130)"><rect class="w" width="205" height="140" rx="14"/><text class="h" x="102" y="45" text-anchor="middle">Input generation</text><text class="s" x="102" y="78" text-anchor="middle">DEMUX + current DAC</text><text class="s" x="102" y="106" text-anchor="middle">IGC1 ... IGCd</text></g><path class="x" d="M515 200H585"/><g transform="translate(585 115)"><rect class="g" width="220" height="170" rx="14"/><text class="h" x="110" y="45" text-anchor="middle">Hidden layer</text><text class="s" x="110" y="80" text-anchor="middle">Current-mirror weights</text><text class="s" x="110" y="110" text-anchor="middle">Oscillator neurons</text><text class="s" x="110" y="140" text-anchor="middle">N1 ... NL</text></g><path class="x" d="M805 200H875"/><g transform="translate(875 130)"><rect class="b" width="265" height="140" rx="14"/><text class="h" x="132" y="45" text-anchor="middle">Digital readout</text><text class="s" x="132" y="78" text-anchor="middle">TSPC counters + PIPO</text><text class="s" x="132" y="106" text-anchor="middle">Column scanner</text></g><path class="x" d="M1007 270V360"/><g transform="translate(875 360)"><rect class="w" width="265" height="115" rx="14"/><text class="h" x="132" y="47" text-anchor="middle">ELM second stage</text><text class="s" x="132" y="80" text-anchor="middle">Output weights / class</text></g><g transform="translate(310 380)"><rect class="b" width="495" height="125" rx="14"/><text class="h" x="247" y="44" text-anchor="middle">Timing and control</text><text class="s" x="247" y="78" text-anchor="middle">CLK_in · RN_cnt · NEU_EN · CLK_out</text></g><path class="x" d="M558 380V305"/><text x="60" y="615" class="s">Conceptual rendering reconstructed from the implemented circuit hierarchy; no performance result is implied.</text></svg>
