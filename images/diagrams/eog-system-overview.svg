<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="t d"><title id="t">Implemented EOG robot-control system</title><desc id="d">Five electrodes feed a two-channel analog front end, microcontroller classifier, wireless link, and four-state robot controller.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#72543d"/></marker><style>.b{fill:#fff;stroke:#403d36;stroke-width:2}.g{fill:#eef1eb;stroke:#49604e;stroke-width:2}.w{fill:#f5eee7;stroke:#72543d;stroke-width:2}.h{font:700 24px Arial;fill:#25231f}.s{font:600 16px Arial;fill:#403d36}.x{stroke:#72543d;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect width="1200" height="580" fill="#f7f6f2"/><text x="55" y="62" class="h">Implemented EOG Robot-Control System</text><g transform="translate(35 190)"><rect class="b" width="170" height="160" rx="14"/><text class="h" x="85" y="43" text-anchor="middle">5 electrodes</text><text class="s" x="85" y="78" text-anchor="middle">horizontal pair</text><text class="s" x="85" y="105" text-anchor="middle">vertical pair</text><text class="s" x="85" y="132" text-anchor="middle">reference</text></g><path class="x" d="M205 270H255"/><g transform="translate(255 175)"><rect class="w" width="220" height="190" rx="14"/><text class="h" x="110" y="43" text-anchor="middle">Two-channel AFE</text><text class="s" x="110" y="78" text-anchor="middle">INA118 gain stage</text><text class="s" x="110" y="105" text-anchor="middle">0.72–15.9 Hz filtering</text><text class="s" x="110" y="132" text-anchor="middle">0–5 V level shift</text></g><path class="x" d="M475 270H525"/><g transform="translate(525 175)"><rect class="g" width="225" height="190" rx="14"/><text class="h" x="112" y="43" text-anchor="middle">MCU classifier</text><text class="s" x="112" y="78" text-anchor="middle">blink · left · right</text><text class="s" x="112" y="106" text-anchor="middle">centre fixation</text><text class="s" x="112" y="140" text-anchor="middle">threshold decision</text></g><path class="x" d="M750 270H800"/><g transform="translate(800 195)"><rect class="b" width="145" height="150" rx="14"/><text class="h" x="72" y="45" text-anchor="middle">HC-12</text><text class="s" x="72" y="80" text-anchor="middle">115.2 kbps</text><text class="s" x="72" y="108" text-anchor="middle">wireless link</text></g><path class="x" d="M945 270H990"/><g transform="translate(990 175)"><rect class="w" width="175" height="190" rx="14"/><text class="h" x="87" y="43" text-anchor="middle">Robot control</text><text class="s" x="87" y="78" text-anchor="middle">forward</text><text class="s" x="87" y="105" text-anchor="middle">left · right</text><text class="s" x="87" y="132" text-anchor="middle">stop</text></g></svg>
