<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Implemented 3-bit Flash ADC signal path</title><desc id="desc">Input and reference ladder feed seven comparators, followed by thermometer-to-Gray encoding and Gray-to-binary decoding.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#72543d"/></marker><style>.box{fill:#fff;stroke:#403d36;stroke-width:2}.alt{fill:#f5eee7;stroke:#72543d;stroke-width:2}.h{font:700 25px Arial;fill:#25231f}.s{font:600 17px Arial;fill:#403d36}.a{stroke:#72543d;stroke-width:3;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1200" height="520" fill="#f7f6f2"/><text x="60" y="62" class="h">Implemented 3-bit Flash ADC Signal Path</text>
  <g transform="translate(45 180)"><rect class="box" width="150" height="120" rx="14"/><text class="h" x="75" y="46" text-anchor="middle">V<tspan baseline-shift="sub" font-size="16">in</tspan></text><text class="s" x="75" y="80" text-anchor="middle">0–1 V</text></g><path class="a" d="M195 240H250"/>
  <g transform="translate(250 150)"><rect class="alt" width="190" height="180" rx="14"/><text class="h" x="95" y="45" text-anchor="middle">Reference ladder</text><text class="s" x="95" y="82" text-anchor="middle">7 thresholds</text><text class="s" x="95" y="112" text-anchor="middle">q = 0.125 V</text></g><path class="a" d="M440 240H500"/>
  <g transform="translate(500 150)"><rect class="box" width="190" height="180" rx="14"/><text class="h" x="95" y="46" text-anchor="middle">7 comparators</text><text class="s" x="95" y="85" text-anchor="middle">open-loop slicing</text><text class="s" x="95" y="116" text-anchor="middle">thermometer code</text></g><path class="a" d="M690 240H750"/>
  <g transform="translate(750 150)"><rect class="alt" width="175" height="180" rx="14"/><text class="h" x="87" y="46" text-anchor="middle">Gray encoder</text><text class="s" x="87" y="86" text-anchor="middle">thermometer</text><text class="s" x="87" y="116" text-anchor="middle">to Gray</text></g><path class="a" d="M925 240H980"/>
  <g transform="translate(980 150)"><rect class="box" width="175" height="180" rx="14"/><text class="h" x="87" y="46" text-anchor="middle">Binary decoder</text><text class="s" x="87" y="86" text-anchor="middle">Gray to binary</text><text class="s" x="87" y="116" text-anchor="middle">D2 : D0</text></g>
</svg>
