<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Redrawn 3-bit Flash ADC architecture</title>
  <desc id="desc">The analog input and seven reference-ladder thresholds independently feed a seven-comparator bank. Its thermometer code is converted to Gray code and then to a three-bit binary output.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#72543d"/></marker><style>.box{fill:#fff;stroke:#403d36;stroke-width:2}.alt{fill:#f5eee7;stroke:#72543d;stroke-width:2}.h{font:700 25px Arial;fill:#25231f}.s{font:600 17px Arial;fill:#403d36}.a{stroke:#72543d;stroke-width:3;fill:none;marker-end:url(#arrow)}.tap{stroke:#72543d;stroke-width:2;fill:none}.note{font:500 14px Arial;fill:#6b675f}</style></defs>
  <rect width="1200" height="560" fill="#f7f6f2"/><text x="55" y="58" class="h">3-bit Flash ADC signal path</text><text x="55" y="84" class="note">Redrawn from the implemented Cadence hierarchy</text>
  <g transform="translate(45 150)"><rect class="box" width="150" height="105" rx="14"/><text class="h" x="75" y="43" text-anchor="middle">V<tspan baseline-shift="sub" font-size="16">in</tspan></text><text class="s" x="75" y="75" text-anchor="middle">0–1 V ramp</text></g>
  <g transform="translate(45 325)"><rect class="alt" width="220" height="145" rx="14"/><text class="h" x="110" y="42" text-anchor="middle">Resistive ladder</text><text class="s" x="110" y="78" text-anchor="middle">7 reference taps</text><text class="s" x="110" y="108" text-anchor="middle">q = 0.125 V</text></g>
  <g transform="translate(390 175)"><rect class="box" width="210" height="230" rx="14"/><text class="h" x="105" y="46" text-anchor="middle">7 comparators</text><text class="s" x="105" y="88" text-anchor="middle">Vin compared with</text><text class="s" x="105" y="116" text-anchor="middle">seven ladder taps</text><text class="s" x="105" y="163" text-anchor="middle">7-bit thermometer code</text></g>
  <path class="a" d="M195 202H390"/><path class="tap" d="M265 397H330V335H390"/><path class="a" d="M330 335H390"/>
  <path class="a" d="M600 290H680"/><g transform="translate(680 195)"><rect class="alt" width="190" height="190" rx="14"/><text class="h" x="95" y="46" text-anchor="middle">Thermometer</text><text class="h" x="95" y="76" text-anchor="middle">to Gray</text><text class="s" x="95" y="120" text-anchor="middle">3-bit Gray code</text></g>
  <path class="a" d="M870 290H940"/><g transform="translate(940 195)"><rect class="box" width="205" height="190" rx="14"/><text class="h" x="102" y="46" text-anchor="middle">Gray to binary</text><text class="s" x="102" y="93" text-anchor="middle">D2 · D1 · D0</text><text class="s" x="102" y="126" text-anchor="middle">8 output codes</text></g>
</svg>
