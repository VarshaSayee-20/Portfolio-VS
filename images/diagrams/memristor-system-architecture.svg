<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Memristor iterative encoder and decoder architecture</title><desc id="d">Voltage input is converted to current, encoded by iterative RRAM CMOS neurons, and decoded by integration or STDP paths.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#72543d"/></marker><style>.b{fill:#fff;stroke:#403d36;stroke-width:2}.g{fill:#eef1eb;stroke:#49604e;stroke-width:2}.w{fill:#f5eee7;stroke:#72543d;stroke-width:2}.h{font:700 25px Arial;fill:#25231f}.s{font:600 18px Arial;fill:#403d36}.x{stroke:#72543d;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect width="1200" height="675" fill="#f7f6f2"/><text x="60" y="68" class="h">Implemented RRAM-CMOS Temporal Encoding System</text><g transform="translate(55 165)"><rect class="b" width="165" height="105" rx="14"/><text class="h" x="82" y="46" text-anchor="middle">Analog input</text><text class="s" x="82" y="76" text-anchor="middle">V<tspan baseline-shift="sub">in</tspan></text></g><path class="x" d="M220 218H280"/><g transform="translate(280 150)"><rect class="w" width="190" height="135" rx="14"/><text class="h" x="95" y="44" text-anchor="middle">V-to-I stage</text><text class="s" x="95" y="77" text-anchor="middle">PTAT reference</text><text class="s" x="95" y="105" text-anchor="middle">Op-amp converter</text></g><path class="x" d="M470 218H530"/><g transform="translate(530 125)"><rect class="g" width="250" height="185" rx="14"/><text class="h" x="125" y="44" text-anchor="middle">Iterative encoder</text><text class="s" x="125" y="82" text-anchor="middle">1T-1R RRAM-CMOS</text><text class="s" x="125" y="112" text-anchor="middle">LIF neuron pool</text><text class="s" x="125" y="142" text-anchor="middle">Spike propagation</text></g><path class="x" d="M780 218H850"/><g transform="translate(850 150)"><rect class="b" width="285" height="135" rx="14"/><text class="h" x="142" y="45" text-anchor="middle">ISI spike train</text><text class="s" x="142" y="82" text-anchor="middle">Temporal information</text></g><path class="x" d="M992 285V350"/><g transform="translate(745 350)"><rect class="w" width="240" height="130" rx="14"/><text class="h" x="120" y="44" text-anchor="middle">Integration decoder</text><text class="s" x="120" y="79" text-anchor="middle">Window + integrator</text><text class="s" x="120" y="105" text-anchor="middle">Resolved voltage level</text></g><g transform="translate(1010 350)"><rect class="b" width="125" height="130" rx="14"/><text class="h" x="62" y="52" text-anchor="middle">STDP</text><text class="s" x="62" y="85" text-anchor="middle">comparison</text></g><path class="x" d="M992 285V330H865V350"/><path class="x" d="M992 330H1072V350"/><text x="60" y="610" class="s">System overview recreated from the implemented thesis signal path; literature-derived figures are excluded.</text></svg>
