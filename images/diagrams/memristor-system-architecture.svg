<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">Redrawn RRAM-CMOS temporal encoding and decoding architecture</title><desc id="d">An analog input is converted to current and encoded as an inter-spike-interval sequence by an iterative RRAM-CMOS neuron chain. The spike train enters either an integration decoder, which reconstructs an output voltage, or an implemented literature-based STDP decoder, which produces a pattern-dependent decoded voltage.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#72543d"/></marker><style>.b{fill:#fff;stroke:#403d36;stroke-width:2}.g{fill:#eef1eb;stroke:#49604e;stroke-width:2}.w{fill:#f5eee7;stroke:#72543d;stroke-width:2}.h{font:700 23px Arial;fill:#25231f}.s{font:600 15px Arial;fill:#403d36}.n{font:500 14px Arial;fill:#6b675f}.x{stroke:#72543d;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect width="1200" height="650" fill="#f7f6f2"/><text x="55" y="58" class="h">RRAM-CMOS temporal encoder and two decoder paths</text><text x="55" y="84" class="n">Redrawn from the thesis architecture and Cadence implementations</text>
<g transform="translate(35 165)"><rect class="b" width="135" height="110" rx="14"/><text class="h" x="67" y="45" text-anchor="middle">Analog input</text><text class="s" x="67" y="78" text-anchor="middle">Vin</text></g><path class="x" d="M170 220H215"/>
<g transform="translate(215 145)"><rect class="w" width="175" height="150" rx="14"/><text class="h" x="87" y="44" text-anchor="middle">V-to-I stage</text><text class="s" x="87" y="80" text-anchor="middle">PTAT + op-amp</text><text class="s" x="87" y="107" text-anchor="middle">current conversion</text></g><path class="x" d="M390 220H435"/>
<g transform="translate(435 125)"><rect class="g" width="220" height="190" rx="14"/><text class="h" x="110" y="44" text-anchor="middle">Iterative encoder</text><text class="s" x="110" y="80" text-anchor="middle">1T–1R RRAM-CMOS</text><text class="s" x="110" y="107" text-anchor="middle">four-neuron chain</text><text class="s" x="110" y="134" text-anchor="middle">OR spike combiner</text></g><path class="x" d="M655 220H705"/>
<g transform="translate(705 150)"><rect class="b" width="185" height="140" rx="14"/><text class="h" x="92" y="45" text-anchor="middle">ISI spike train</text><text class="s" x="92" y="82" text-anchor="middle">temporal code</text></g><circle cx="925" cy="220" r="5" fill="#72543d"/><path class="x" d="M890 220H925V400H670"/><path class="x" d="M925 220V400H990"/>
<g transform="translate(455 400)"><rect class="w" width="295" height="145" rx="14"/><text class="h" x="147" y="43" text-anchor="middle">Integration decoder</text><text class="s" x="147" y="78" text-anchor="middle">adaptive window + integrator</text><text class="s" x="147" y="106" text-anchor="middle">sample, threshold, low-pass</text></g><path class="x" d="M750 472H800"/><g transform="translate(800 420)"><rect class="g" width="155" height="105" rx="14"/><text class="h" x="77" y="40" text-anchor="middle">Reconstructed</text><text class="s" x="77" y="72" text-anchor="middle">voltage level</text></g>
<g transform="translate(990 360)"><rect class="b" width="175" height="145" rx="14"/><text class="h" x="87" y="43" text-anchor="middle">STDP decoder</text><text class="s" x="87" y="78" text-anchor="middle">literature topology</text><text class="s" x="87" y="106" text-anchor="middle">Cadence implementation</text></g><path class="x" d="M1077 505V545"/><text x="1077" y="572" class="s" text-anchor="middle">pattern-dependent</text><text x="1077" y="596" class="s" text-anchor="middle">decoded voltage</text></svg>
