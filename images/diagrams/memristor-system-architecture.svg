<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="t d"><title id="t">Memristor iterative encoder and decoder architecture</title><desc id="d">Voltage input is converted to current, encoded by an iterative RRAM-CMOS neuron pool, then decoded through integration or STDP paths.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#72543d"/></marker><style>.b{fill:#fff;stroke:#403d36;stroke-width:2}.g{fill:#eef1eb;stroke:#49604e;stroke-width:2}.w{fill:#f5eee7;stroke:#72543d;stroke-width:2}.h{font:700 24px Arial;fill:#25231f}.s{font:600 17px Arial;fill:#403d36}.x{stroke:#72543d;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect width="1200" height="600" fill="#f7f6f2"/><text x="55" y="62" class="h">Implemented RRAM-CMOS Temporal Encoding and Decoding</text><g transform="translate(40 165)"><rect class="b" width="145" height="115" rx="14"/><text class="h" x="72" y="47" text-anchor="middle">Analog input</text><text class="s" x="72" y="80" text-anchor="middle">V<tspan baseline-shift="sub">in</tspan></text></g><path class="x" d="M185 222H240"/><g transform="translate(240 145)"><rect class="w" width="185" height="155" rx="14"/><text class="h" x="92" y="45" text-anchor="middle">V-to-I stage</text><text class="s" x="92" y="80" text-anchor="middle">PTAT reference</text><text class="s" x="92" y="109" text-anchor="middle">op-amp converter</text></g><path class="x" d="M425 222H480"/><g transform="translate(480 125)"><rect class="g" width="245" height="195" rx="14"/><text class="h" x="122" y="44" text-anchor="middle">Iterative encoder</text><text class="s" x="122" y="80" text-anchor="middle">1T-1R RRAM-CMOS</text><text class="s" x="122" y="109" text-anchor="middle">LIF neuron pool</text><text class="s" x="122" y="138" text-anchor="middle">spike propagation</text></g><path class="x" d="M725 222H785"/><g transform="translate(785 150)"><rect class="b" width="230" height="145" rx="14"/><text class="h" x="115" y="45" text-anchor="middle">ISI spike train</text><text class="s" x="115" y="82" text-anchor="middle">temporal information</text></g><circle cx="1015" cy="222" r="5" fill="#72543d"/><path class="x" d="M1015 222V365H815"/><path class="x" d="M1015 222V365H1090"/><g transform="translate(665 365)"><rect class="w" width="300" height="145" rx="14"/><text class="h" x="150" y="45" text-anchor="middle">Integration decoder</text><text class="s" x="150" y="80" text-anchor="middle">window generator + integrator</text><text class="s" x="150" y="109" text-anchor="middle">sample, threshold, low-pass</text></g><g transform="translate(1010 365)"><rect class="b" width="155" height="145" rx="14"/><text class="h" x="77" y="47" text-anchor="middle">STDP decoder</text><text class="s" x="77" y="84" text-anchor="middle">temporal pattern</text><text class="s" x="77" y="111" text-anchor="middle">comparison</text></g></svg>
