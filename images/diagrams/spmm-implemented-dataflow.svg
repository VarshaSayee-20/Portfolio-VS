<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">Implemented 5 by 5 RTL SpMM architecture</title><desc id="d">Dense matrices are compressed, processed by five outer-product PEs, sorted, merged, and accumulated into a dense result.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#72543d"/></marker><style>.b{fill:#fff;stroke:#403d36;stroke-width:2}.g{fill:#eef1eb;stroke:#49604e;stroke-width:2}.w{fill:#f5eee7;stroke:#72543d;stroke-width:2}.h{font:700 23px Arial;fill:#25231f}.s{font:600 16px Arial;fill:#403d36}.x{stroke:#72543d;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect width="1200" height="520" fill="#f7f6f2"/><text x="55" y="62" class="h">Implemented 5×5 RTL SpMM Architecture</text><g transform="translate(35 175)"><rect class="b" width="145" height="135" rx="13"/><text class="h" x="72" y="46" text-anchor="middle">Dense A, B</text><text class="s" x="72" y="82" text-anchor="middle">5×5 matrices</text></g><path class="x" d="M180 242H220"/><g transform="translate(220 155)"><rect class="w" width="175" height="175" rx="13"/><text class="h" x="87" y="46" text-anchor="middle">CSC / CSR</text><text class="s" x="87" y="82" text-anchor="middle">values + indices</text><text class="s" x="87" y="112" text-anchor="middle">nonzero streams</text></g><path class="x" d="M395 242H435"/><g transform="translate(435 140)"><rect class="g" width="200" height="205" rx="13"/><text class="h" x="100" y="47" text-anchor="middle">5-PE array</text><text class="s" x="100" y="84" text-anchor="middle">index match</text><text class="s" x="100" y="114" text-anchor="middle">outer products</text><text class="s" x="100" y="144" text-anchor="middle">tagged partials</text></g><path class="x" d="M635 242H675"/><g transform="translate(675 155)"><rect class="w" width="165" height="175" rx="13"/><text class="h" x="82" y="47" text-anchor="middle">Bitonic sort</text><text class="s" x="82" y="84" text-anchor="middle">8-input network</text><text class="s" x="82" y="114" text-anchor="middle">ordered indices</text></g><path class="x" d="M840 242H880"/><g transform="translate(880 155)"><rect class="b" width="150" height="175" rx="13"/><text class="h" x="75" y="47" text-anchor="middle">Merge</text><text class="s" x="75" y="84" text-anchor="middle">equal indices</text><text class="s" x="75" y="114" text-anchor="middle">accumulate</text></g><path class="x" d="M1030 242H1070"/><g transform="translate(1070 175)"><rect class="g" width="95" height="135" rx="13"/><text class="h" x="47" y="47" text-anchor="middle">C</text><text class="s" x="47" y="82" text-anchor="middle">dense</text></g></svg>
