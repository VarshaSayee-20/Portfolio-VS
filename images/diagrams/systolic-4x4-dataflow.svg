<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="t d"><title id="t">Redrawn 4 by 4 systolic multiply-accumulate dataflow</title><desc id="d">Four A inputs enter from the left and move across rows. Four B inputs enter from the top and move down columns. Each DPU multiplies, accumulates, and forwards data; four accumulated outputs leave the bottom.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#72543d"/></marker><style>.p{fill:#f5eee7;stroke:#72543d;stroke-width:2}.h{font:700 23px Arial;fill:#25231f}.s{font:600 15px Arial;fill:#403d36}.n{font:500 14px Arial;fill:#6b675f}.x{stroke:#72543d;stroke-width:2.5;fill:none;marker-end:url(#a)}</style></defs><rect width="1200" height="660" fill="#f7f6f2"/><text x="55" y="58" class="h">4×4 systolic multiply-accumulate dataflow</text><text x="55" y="84" class="n">Redrawn from the project schematic hierarchy</text><g transform="translate(330 150)">
