<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">LLM-assisted physical-design optimization and Tempus closure flow</title>
  <desc id="desc">RTL, constraints, libraries, and MMMC views move through Genus synthesis, Innovus floorplanning, placement, clock-tree synthesis and routing, parasitic extraction, and independent Tempus setup and hold analysis. Source-linked reports guide a bounded LLM experiment; deterministic command validation, DRC, connectivity, timing, and provenance gates decide whether an ECO is accepted.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 Z" fill="#766c5e"/></marker>
    <marker id="loopArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 Z" fill="#9a6b3d"/></marker>
    <style>
      .eyebrow{font:700 19px Inter,Segoe UI,Arial,sans-serif;letter-spacing:4px;fill:#85633e}.heading{font:700 34px Inter,Segoe UI,Arial,sans-serif;fill:#25231f}.lane{font:700 16px Inter,Segoe UI,Arial,sans-serif;letter-spacing:2px;fill:#867d70}.label{font:700 23px Inter,Segoe UI,Arial,sans-serif;fill:#25231f;text-anchor:middle}.labelLight{font:700 23px Inter,Segoe UI,Arial,sans-serif;fill:#fff;text-anchor:middle}.sub{font:500 16px Inter,Segoe UI,Arial,sans-serif;fill:#655f56;text-anchor:middle}.subLight{font:500 16px Inter,Segoe UI,Arial,sans-serif;fill:#e9e3d9;text-anchor:middle}.tiny{font:600 13px Inter,Segoe UI,Arial,sans-serif;fill:#655f56;text-anchor:middle}.metric{font:700 13px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#85633e;text-anchor:middle}.arrow{fill:none;stroke:#766c5e;stroke-width:4;marker-end:url(#arrow)}.loop{fill:none;stroke:#9a6b3d;stroke-width:4;marker-end:url(#loopArrow)}
    </style>
  </defs>
  <rect width="1600" height="900" rx="34" fill="#f8f6f1"/>
  <text x="68" y="62" class="eyebrow">IMPLEMENTED PHYSICAL-DESIGN WORKFLOW</text>
  <text x="68" y="108" class="heading">LLM-assisted RTL-to-GDS optimization with independent Tempus closure</text>
  <text x="70" y="158" class="lane">IMPLEMENTATION + SIGN-OFF</text>

  <g transform="translate(68 188)"><rect width="250" height="160" rx="18" fill="#fff" stroke="#d8d0c3" stroke-width="3"/><text x="125" y="44" class="label">Design inputs</text><text x="125" y="78" class="sub">RTL · SDC · Liberty</text><text x="125" y="104" class="sub">LEF / tech LEF · RC corners</text><text x="125" y="134" class="metric">MMMC views + constraints</text></g>
  <g transform="translate(370 188)"><rect width="250" height="160" rx="18" fill="#f2eadf" stroke="#b58a58" stroke-width="3"/><text x="125" y="44" class="label">Genus</text><text x="125" y="78" class="sub">Elaborate · map · optimize</text><text x="125" y="104" class="sub">SDC and timing checks</text><text x="125" y="134" class="metric">netlist · SDC · reports</text></g>
  <g transform="translate(672 168)"><rect width="330" height="200" rx="18" fill="#f2eadf" stroke="#b58a58" stroke-width="3"/><text x="165" y="42" class="label">Innovus implementation</text><rect x="20" y="66" width="137" height="46" rx="9" fill="#fff" stroke="#d8d0c3"/><rect x="173" y="66" width="137" height="46" rx="9" fill="#fff" stroke="#d8d0c3"/><rect x="20" y="124" width="137" height="46" rx="9" fill="#fff" stroke="#d8d0c3"/><rect x="173" y="124" width="137" height="46" rx="9" fill="#fff" stroke="#d8d0c3"/><text x="88" y="94" class="tiny">Floorplan + PG</text><text x="241" y="94" class="tiny">Place + pre-CTS opt</text><text x="88" y="152" class="tiny">CTS + hold opt</text><text x="241" y="152" class="tiny">Route + post-route opt</text><text x="165" y="190" class="metric">DRC · connectivity · SPEF</text></g>
  <g transform="translate(1054 188)"><rect width="250" height="160" rx="18" fill="#2d2a26" stroke="#2d2a26" stroke-width="3"/><text x="125" y="44" class="labelLight">Tempus MMMC STA</text><text x="125" y="78" class="subLight">RC extraction + SPEF</text><text x="125" y="104" class="subLight">Setup / hold path analysis</text><text x="125" y="134" class="metric" style="fill:#e2c59f">WNS · TNS · FEP</text></g>
  <g transform="translate(1356 188)"><rect width="176" height="160" rx="18" fill="#e7ecdf" stroke="#8a9a71" stroke-width="3"/><text x="88" y="43" class="label" style="font-size:20px">Sign-off gate</text><text x="88" y="76" class="tiny">setup / hold TNS = 0</text><text x="88" y="101" class="tiny">FEP = 0</text><text x="88" y="126" class="tiny">DRC / connectivity = 0</text><text x="88" y="148" class="metric">PASS / ITERATE</text></g>
  <path d="M318 268H356" class="arrow"/><path d="M620 268H658" class="arrow"/><path d="M1002 268H1040" class="arrow"/><path d="M1304 268H1342" class="arrow"/>

  <text x="70" y="432" class="lane">SOURCE-LINKED, HUMAN-REVIEWED OPTIMIZATION LOOP</text>
  <g transform="translate(68 468)"><rect width="270" height="150" rx="18" fill="#fff" stroke="#d8d0c3" stroke-width="3"/><text x="135" y="42" class="label">Report parsers</text><text x="135" y="76" class="sub">Genus · Innovus · Tempus</text><text x="135" y="104" class="sub">timing · DRC · area · power</text><text x="135" y="132" class="metric">source + line provenance</text></g>
  <g transform="translate(390 468)"><rect width="270" height="150" rx="18" fill="#eee8df" stroke="#9d8d78" stroke-width="3"/><text x="135" y="42" class="label">Bounded LLM plan</text><text x="135" y="76" class="sub">Choose one legal experiment</text><text x="135" y="104" class="sub">utilization · margin · aspect ratio</text><text x="135" y="132" class="metric">or localized timing ECO</text></g>
  <g transform="translate(712 468)"><rect width="270" height="150" rx="18" fill="#fff" stroke="#d8d0c3" stroke-width="3"/><text x="135" y="42" class="label">Command guardrails</text><text x="135" y="76" class="sub">Whitelist + syntax validation</text><text x="135" y="104" class="sub">One controlled change per run</text><text x="135" y="132" class="metric">reject unsafe proposal</text></g>
  <g transform="translate(1034 468)"><rect width="270" height="150" rx="18" fill="#fff8ee" stroke="#a16e38" stroke-width="3"/><text x="135" y="42" class="label">Apply physical ECO</text><text x="135" y="76" class="sub">Buffer insert · cell resize</text><text x="135" y="104" class="sub">Reroute · re-extract parasitics</text><text x="135" y="132" class="metric">fresh implementation only</text></g>
  <g transform="translate(1356 468)"><rect width="176" height="150" rx="18" fill="#fff" stroke="#8a9a71" stroke-width="3"/><text x="88" y="42" class="label" style="font-size:20px">Dashboard V2</text><text x="88" y="75" class="tiny">compare 16 runs</text><text x="88" y="101" class="tiny">retain failures</text><text x="88" y="127" class="metric">audit provenance</text></g>
  <path d="M338 543H376" class="arrow"/><path d="M660 543H698" class="arrow"/><path d="M982 543H1020" class="arrow"/><path d="M1304 543H1342" class="arrow"/>
  <path d="M1444 348V430H203V454" class="arrow"/><text x="1130" y="420" class="lane" style="letter-spacing:1px">FAIL / TIGHT SLACK → PARSE THE NEW WORST PATH</text>
  <path d="M1169 468V414H837V382" class="loop"/><text x="955" y="401" class="lane" style="letter-spacing:1px;fill:#9a6b3d">VALIDATED ECO → INNOVUS RERUN</text>
  <path d="M1444 618V676H837V632" class="arrow"/><text x="1040" y="701" class="lane" style="letter-spacing:1px">PASS → RECORD QoR, PROVENANCE, AND STOPPING DECISION</text>
  <g transform="translate(68 750)"><rect width="1464" height="92" rx="16" fill="#efede7" stroke="#d8d0c3" stroke-width="2"/><text x="28" y="35" class="lane" style="letter-spacing:1px">ACCEPTANCE RULE</text><text x="28" y="66" class="sub" style="text-anchor:start">The LLM proposes the next bounded experiment; Python validation, rerun reports, independent Tempus analysis, and the engineer decide whether the change is kept.</text></g>
</svg>
